configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Optina",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB}",
            "Username": "${POSTGRES_USER}",
            "PassFile": "/pgpass",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin_pgpass:
    content: |
      postgres:5432:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}

volumes:
  postgres_data:
    name: Optina-database-data
  pgadmin_data:
    name: Optina-pgadmin-data
  # redis_data:
  #   name: Optina-redis-data